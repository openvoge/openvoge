# Every push to main builds the app, tags a new version and publishes a GitHub Release
# whose notes are generated from the commit history since the previous release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time so two quick pushes can't claim the same tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version tag
        id: version
        run: |
          base=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          base=${base:-1.0}
          last_patch=$(git tag --list "v${base}.*" | sed "s/^v${base}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n1)
          next_patch=$(( ${last_patch:--1} + 1 ))
          tag="v${base}.${next_patch}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Next tag: $tag (previous: ${previous:-none})"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "openvoge-${{ steps.version.outputs.tag }}.apk"

      - name: Release notes from commit history
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          range=${PREVIOUS:+$PREVIOUS..}HEAD
          {
            echo "Built automatically from the commit history${PREVIOUS:+ since $PREVIOUS}."
            echo
            echo "## Changes"
            git log "$range" --no-merges --pretty=format:'- %s (%h) — %an'
            echo
            echo
            echo "## Install"
            echo "Download \`openvoge-$TAG.apk\` below and open it on your phone (allow installs from unknown sources)."
            echo "The APK is debug-signed; uninstall builds signed with a different key before installing."
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$PREVIOUS...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "openvoge-$TAG.apk" \
            --title "OpenVOGE $TAG" \
            --notes-file release-notes.md \
            --verify-tag
